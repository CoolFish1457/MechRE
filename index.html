<!-- ===== ORBITAL GLOBE STATISTICS ===== -->
<div class="problem-orbit-stage fade-up">
  <div class="orbit-ring orbit-ring-outer"></div>
  <div class="orbit-ring orbit-ring-inner"></div>
  <div class="globe-aura"></div>

  <div class="globe">
    <svg class="globe-svg" viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <radialGradient id="globeFill" cx="35%" cy="28%" r="78%">
          <stop offset="0%"   stop-color="#3d1a12"/>
          <stop offset="55%"  stop-color="#1a0c09"/>
          <stop offset="100%" stop-color="#070303"/>
        </radialGradient>
      </defs>
      <circle cx="100" cy="100" r="94" fill="url(#globeFill)"/>
      <g class="globe-lines">
        <ellipse cx="100" cy="100" rx="94" ry="62"/>
        <ellipse cx="100" cy="100" rx="94" ry="28"/>
        <line x1="6" y1="100" x2="194" y2="100"/>
      </g>
      <g class="globe-lines globe-meridians">
        <ellipse cx="100" cy="100" rx="94" ry="94"/>
        <ellipse cx="100" cy="100" rx="62" ry="94"/>
        <ellipse cx="100" cy="100" rx="28" ry="94"/>
        <line x1="100" y1="6" x2="100" y2="194"/>
      </g>
      <circle class="globe-outline" cx="100" cy="100" r="94"/>
    </svg>
    <div class="globe-content">
      <div class="globe-number"><span data-problem-target="27">0</span><span class="globe-pct">%</span></div>
      <div class="globe-label">World</div>
      <div class="globe-sub">2.2 billion people</div>
    </div>
  </div>

  <div class="orbit">
    <div class="orbit-item" style="--angle:315deg">
      <div class="orbit-card">
        <div class="orbit-card-num"><span data-problem-target="21.3">0</span><span class="orbit-pct">%</span></div>
        <div class="orbit-card-label">Sri Lanka</div>
      </div>
    </div>
    <div class="orbit-item" style="--angle:45deg">
      <div class="orbit-card">
        <div class="orbit-card-num"><span data-problem-target="26.7">0</span><span class="orbit-pct">%</span></div>
        <div class="orbit-card-label">India</div>
      </div>
    </div>
    <div class="orbit-item" style="--angle:225deg">
      <div class="orbit-card">
        <div class="orbit-card-num"><span data-problem-target="9">0</span><span class="orbit-pct">%</span></div>
        <div class="orbit-card-label">Africa</div>
      </div>
    </div>
    <div class="orbit-item" style="--angle:135deg">
      <div class="orbit-card">
        <div class="orbit-card-num"><span data-problem-target="9.3">0</span><span class="orbit-pct">%</span></div>
        <div class="orbit-card-label">Americas</div>
      </div>
    </div>
  </div>
</div>
<!-- ===== /ORBITAL GLOBE STATISTICS ===== -->
